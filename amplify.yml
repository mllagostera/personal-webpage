version: 1
frontend:
  phases:
    preBuild:
      commands:
        # The build image defaults to Node 22. Take the latest 24.x, the same
        # major as the compute runtime (see nuxt.config.ts), without the
        # image's default global packages (Amplify CLI, Cypress, ...), which
        # the build never uses.
        - nvm install 24 --skip-default-packages
        - node -v
        - npm install -g npm@11.8.0
        - npm ci --legacy-peer-deps
        - npm run lint
    build:
      commands:
        - env | grep -e TELEGRAM_BOT_TOKEN -e TELEGRAM_CHAT_ID >> .env
        # git first: Amplify sets AWS_COMMIT_ID to "HEAD" on a manual rebuild.
        - echo "BUILD_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "$AWS_COMMIT_ID")" >> .env
        - npm run build
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .nuxt/**/*
