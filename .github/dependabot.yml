version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    # No target-branch: main is the default branch already, and setting one
    # makes this block apply to version updates only, so security updates
    # would ignore the labels and the npm-security group below.
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    # Every update touches package-lock.json, so separate PRs conflict with
    # each other as soon as one is merged. Majors stay out of the groups:
    # each one is its own change, proposed before it is applied.
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
